<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calc Tic-Tac-Toe</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 10px; }
        #splash-screen { display: flex; align-items: center; justify-content: center; width: 100%; height: 100vh; position: fixed; top: 0; left: 0; background: #fff; z-index: 200; }
        #intro { display: none; text-align: center; width: 100%; max-width: 400px; padding: 20px; }
        #game-container { display: none; text-align: center; width: 100%; max-width: 400px; padding: 10px; }
        #rules { width: 100%; max-width: 400px; margin: 15px auto; padding: 12px; background: #fffde7; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; line-height: 1.4; text-align: left; }
        #grid-wrapper { background: #f0f4f8; padding: 15px; border-radius: 12px; display: inline-block; width: 100%; max-width: 100%; }
        #board { display: grid; grid-template-columns: repeat(3, min(25vw, 90px)); gap: 10px; justify-content: center; }
        .cell { width: min(25vw, 90px); height: min(25vw, 90px); font-size: calc(min(25vw, 90px) * 0.4); cursor: pointer; border: 3px solid #333; background: #f8f8f8; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; }
        .cell:hover { transform: scale(1.05); background: #e0e0e0; }
        .cell.X { color: #e74c3c; background: #ffdada; }
        .cell.O { color: #3498db; background: #d6ebfa; }
        .btn-main { padding: 15px 30px; cursor: pointer; background: #333; color: #fff; border: none; border-radius: 8px; margin-top: 20px; font-size: 16px; width: 100%; max-width: 250px; }
        #logo { max-width: 250px; width: 80%; height: auto; }
        #question-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 100; padding: 15px; }
        #result-screen { display: none; text-align: center; width: 100%; max-width: 400px; padding: 20px; }
        .modal-content { background: #fff; padding: 25px; border-radius: 12px; max-width: 350px; width: 100%; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); margin: auto; }
        .modal-content p { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 15px; }
        .modal-content input { padding: 10px; width: 100%; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    </style>
</head>
<body>
    <div id="splash-screen">
        <img src="assets/innovine-logo.png" id="logo" alt="Logo">
    </div>

    <div id="intro">
        <h1>Grade 6 ICT</h1>
<h3>Chapter 4:OpenOffice Calc-II</h3>
        <div id="rules"><strong>Rules:</strong> Answer the questions to place 'X'; 3-in-a-row wins; Computer plays 'O'.</div>
        <button class="btn-main" onclick="startGame()">Start Game</button>
    </div>

    <div id="game-container">
        <div id="grid-wrapper">
            <div id="board"></div>
            <button class="btn-main" onclick="location.reload()">Reset Game</button>
        </div>
    </div>

    <div id="question-modal">
        <div class="modal-content">
            <p id="modal-question"></p>
            <input type="text" id="modal-answer" placeholder="Type your answer here..." onkeypress="handleKeyPress(event)">
            <br>
            <button class="btn-main" onclick="submitAnswer()" style="margin-top: 0; padding: 10px 25px; width: auto;">Submit Answer</button>
        </div>
    </div>

    <div id="result-screen">
        <div style="background: #f0f4f8; padding: 30px; border-radius: 12px; width: 100%;">
            <p id="result-message" style="font-size: 24px; font-weight: bold; color: #333; margin-bottom: 20px;"></p>
            <button class="btn-main" onclick="location.reload()" style="margin-top: 0;">Restart Game</button>
        </div>
    </div>

    <script>
        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('intro').style.display = 'block';
        }, 5000);

        let board = Array(9).fill(null), gameActive = true;
        let selectedCell = null;
        let currentAnswer = "";
        let pool = [
            { q: "What statistical function is used to calculate the total of a range of cells?", a: "SUM()" },
            { q: "Which tool allows you to copy a formula to adjacent cells by dragging?", a: "Fill Handle" },
            { q: "Which function is used to find the average value of a set of numbers?", a: "AVERAGE()" },
            { q: "Which feature allows you to display only data that meets specific conditions?", a: "Filtering" },
            { q: "If you want to arrange data from Z to A, which sorting order is this?", a: "Descending" },
            { q: "All mathematical formulas in Calc must begin with which symbol?", a: "=" },
            { q: "Which function finds the smallest number in a selected range?", a: "MIN()" }
        ];
        
        function startGame() { document.getElementById('intro').style.display = 'none'; document.getElementById('game-container').style.display = 'block'; render(); }
        
        function handleMove(i) {
            if(!gameActive || board[i] || pool.length === 0) return;
            
            selectedCell = i;
            const q = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
            currentAnswer = q.a;
            
            document.getElementById('modal-question').innerText = q.q;
            document.getElementById('modal-answer').value = '';
            document.getElementById('question-modal').style.display = 'flex';
            document.getElementById('modal-answer').focus();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                submitAnswer();
            }
        }
        
        function submitAnswer() {
            const ans = document.getElementById('modal-answer').value;
            document.getElementById('question-modal').style.display = 'none';
            
            if(ans && ans.trim().toUpperCase() === currentAnswer.toUpperCase()) { 
                board[selectedCell] = 'X'; 
                new Audio('assets/correct.mp3').play(); 
                render(); 
                checkWinner(); 
                if(gameActive) setTimeout(computerMove, 600); 
            } else { 
                new Audio('assets/wrong.mp3').play(); 
                alert("Incorrect. The correct answer was: " + currentAnswer + ". This question is now removed."); 
            }
            selectedCell = null;
        }
        
        function computerMove() {
            let move = (Math.random() < 0.3) ? null : (findBest('O') || findBest('X'));
            if (move === null) {
                let avail = board.map((v,i)=>v===null?i:null).filter(v=>v!==null);
                move = avail[Math.floor(Math.random()*avail.length)];
            }
            if(move !== null) { board[move] = 'O'; render(); checkWinner(); }
        }
        
        function findBest(p) {
            const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for(let l of lines) { let c = l.map(i=>board[i]); if(c.filter(v=>v===p).length === 2 && c.includes(null)) return l[c.indexOf(null)]; }
            return null;
        }
        
        function checkWinner() {
            const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for(let l of lines) { const [a,b,c] = l; if(board[a] && board[a] === board[b] && board[a] === board[c]) { 
                gameActive = false; 
                document.getElementById('game-container').style.display = 'none';
                document.getElementById('result-message').innerText = board[a] + " Wins!";
                document.getElementById('result-screen').style.display = 'block';
                return; 
            }}
            if(!board.includes(null)) { 
                gameActive = false; 
                document.getElementById('game-container').style.display = 'none';
                document.getElementById('result-message').innerText = "It's a Draw!";
                document.getElementById('result-screen').style.display = 'block';
            }
        }
        
        function render() {
            const bEl = document.getElementById('board'); bEl.innerHTML = '';
            board.forEach((v, i) => { const btn = document.createElement('button'); btn.className = 'cell ' + (v || ''); btn.innerText = v || ''; btn.onclick = () => handleMove(i); bEl.appendChild(btn); });
        }
    </script>
</body>
</html>
